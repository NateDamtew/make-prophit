minimumReleaseAge: 1440
# TEMPORARY: Dynamic 4.89.0 (published 2026-06-16 ~21:43 UTC) is still inside the
# 24h release-age window. Excluded so it installs locally and on Vercel.
# REVERT this block once it clears (~2026-06-17 21:45 UTC).
minimumReleaseAgeExclude:
  - '@dynamic-labs/*'
shellEmulator: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # semver 6 is required by Babel/Next/Sentry transitive tooling.
  - semver@6.3.1
  # slow-redact is pinned through pino -> @walletconnect/logger.
  - slow-redact@0.3.2
  # tinyexec is required by Vitest/lint-staged/Fumadocs tooling.
  - tinyexec@1.2.2
  # @noble/curves 1.8.0 + @noble/hashes 1.7.0 (via @dynamic-labs embedded-wallet ->
  # @turnkey/viem) shipped on 2025-01-03 without provenance attestation; the same
  # maintainer (paulmillr) re-added attestation in 1.8.1 / 1.7.1 on 2025-01-18.
  # Verified legitimate releases, not a takeover.
  - '@noble/curves@1.8.0'
  - '@noble/hashes@1.7.0'
  # @tonconnect/ui 2.4.0 (via @dynamic-labs/ton) shipped without provenance
  # attestation; it's the official TON Connect UI library (ton-connect org).
  # Verified legitimate release, not a takeover.
  - '@tonconnect/ui@2.4.0'
  # ua-parser-js 1.0.41 (transitive via @tonconnect/ui) — provenance gap only.
  # The 2021 compromise was 0.7.29/0.8.0/1.0.0; 1.0.41 is a current clean release.
  - 'ua-parser-js@1.0.41'

allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': true
  '@swc/core': true
  bigint-buffer: true
  bufferutil: false
  esbuild: true
  keccak: false
  protobufjs: true
  sharp: false
  utf-8-validate: false

overrides:
  '@wagmi/connectors': 6.2.0
  '@wagmi/core': 2.22.1
  '@walletconnect/relay-auth>@noble/curves': 1.8.1
  '@walletconnect/relay-auth>@noble/hashes': 1.7.1
