minimumReleaseAge: 1440
# TEMPORARY: Dynamic 4.89.0 (published <24h ago) ships a fix we need now for the
# Turbopack production bundle. Excluded from the release-age guard so it installs
# locally and on Vercel. REVERT once 4.89.0 clears the 24h window.
minimumReleaseAgeExclude:
  - '@dynamic-labs/*'
shellEmulator: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # semver 6 is required by Babel/Next/Sentry transitive tooling.
  - semver@6.3.1
  # slow-redact is pinned through pino -> @walletconnect/logger.
  - slow-redact@0.3.2
  # tinyexec is required by Vitest/lint-staged/Fumadocs tooling.
  - tinyexec@1.2.2
  # @noble/curves 1.8.0 + @noble/hashes 1.7.0 (via @dynamic-labs embedded-wallet ->
  # @turnkey/viem) shipped on 2025-01-03 without provenance attestation; the same
  # maintainer (paulmillr) re-added attestation in 1.8.1 / 1.7.1 on 2025-01-18.
  # Verified legitimate releases, not a takeover.
  - '@noble/curves@1.8.0'
  - '@noble/hashes@1.7.0'

allowBuilds:
  '@parcel/watcher': false
  '@reown/appkit': false
  '@sentry/cli': true
  '@swc/core': true
  bigint-buffer: true
  bufferutil: false
  esbuild: true
  keccak: false
  protobufjs: true
  sharp: false
  utf-8-validate: false

overrides:
  '@wagmi/connectors': 6.2.0
  '@wagmi/core': 2.22.1
  '@walletconnect/relay-auth>@noble/curves': 1.8.1
  '@walletconnect/relay-auth>@noble/hashes': 1.7.1
