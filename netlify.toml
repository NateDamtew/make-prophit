# Netlify build configuration.
#
# Netlify is not used for this site any more (beta deploys from Vercel).
# The site is still linked to the repo and used to fail four checks on every
# pull request because it has no database or env vars. Until the Netlify
# site is deleted, every build is skipped: an ignore command that exits 0
# tells Netlify not to build.

[build]
command = "bun run db:push && bun run build"
ignore = "exit 0"

[build.environment]
BUN_VERSION = "1.4.2"
NODE_VERSION = "24"
